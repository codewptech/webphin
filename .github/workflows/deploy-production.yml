name: Production CI/CD

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: '24'

  # Application-specific deployment configuration
  APP_NAME: webphin
  DEPLOY_PATH: /srv/webphin/apps/webphin
  COMPOSE_SERVICE: webphin
  TAILSCALE_TARGET: webphin-production-shared-vps1

jobs:
  ci:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy production
    if: github.event_name != 'pull_request'
    needs: ci

    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment:
      name: production
      url: https://www.webphin.com

    concurrency:
      group: production-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Connect to tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ env.TAILSCALE_TARGET }}

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/deploy_key"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 \
            "$HOME/.ssh/deploy_key" \
            "$HOME/.ssh/known_hosts"

      - name: Deploy exact commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -o IdentityAgent=none \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=10 \
            -i "$HOME/.ssh/deploy_key" \
            "$VPS_USER@$TAILSCALE_TARGET" \
            bash -s -- \
              "$DEPLOY_SHA" \
              "$DEPLOY_PATH" \
              "$COMPOSE_SERVICE" <<'REMOTE'

          set -euo pipefail

          DEPLOY_SHA="$1"
          DEPLOY_PATH="$2"
          COMPOSE_SERVICE="$3"

          cd "$DEPLOY_PATH"

          echo "Fetching repository..."
          git fetch --prune origin main

          REMOTE_MAIN="$(git rev-parse origin/main)"

          if [ "$DEPLOY_SHA" != "$REMOTE_MAIN" ]; then
              echo "Skipping stale deployment."
              echo "Requested: $DEPLOY_SHA"
              echo "Current main: $REMOTE_MAIN"
              exit 0
          fi

          git cat-file -e "${DEPLOY_SHA}^{commit}"

          echo "Deploying $DEPLOY_SHA..."
          git reset --hard "$DEPLOY_SHA"

          echo "Building image..."
          docker compose build "$COMPOSE_SERVICE"

          echo "Starting application..."

          if ! docker compose up \
              -d \
              --wait \
              --wait-timeout 120 \
              "$COMPOSE_SERVICE"
          then
              echo "Deployment health check failed."

              docker compose ps
              docker compose logs \
                --tail=100 \
                "$COMPOSE_SERVICE"

              exit 1
          fi

          echo "Deployment healthy."
          docker compose ps

          REMOTE
